<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>duo19.13 | Nivel up en tu setup y contenido</title>
    <meta name="description" content="Encuentra periféricos gamer, kits vloggers, iluminación RGB y accesorios para creadores de contenido. Mejora tu setup con duo19.13.">
    
    <!-- Fuentes Google Fonts (Orbitron y Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Estilos CSS -->
    <style>
        /* Variables y Estilos Base Neón */
        :root {
            --bg-base: #0a0a12;
            --bg-surface: #14141f;
            --neon-magenta: #ff2bd6;
            --neon-cyan: #22e5ff;
            --neon-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(34, 229, 255, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6, .brand-logo {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        button {
            cursor: pointer;
            border: none;
            font-family: 'Orbitron', sans-serif;
        }

        /* SVG Icons Helpers */
        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* --- Header y Navegación --- */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glow);
            z-index: 1000;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-magenta), 0 0 20px var(--neon-cyan);
            letter-spacing: 2px;
        }

        .brand-logo span {
            color: var(--neon-cyan);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            width: 40%;
            transition: var(--transition);
        }

        .search-bar:focus-within {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(34, 229, 255, 0.3);
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 100%;
            outline: none;
            margin-left: 10px;
        }

        .header-actions {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .action-btn {
            background: none;
            color: var(--text-main);
            position: relative;
            transition: var(--transition);
        }

        .action-btn:hover {
            color: var(--neon-magenta);
            text-shadow: 0 0 10px var(--neon-magenta);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--neon-magenta);
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-categories {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-glow);
            padding: 0.5rem 5%;
        }

        .nav-categories ul {
            display: flex;
            justify-content: center;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .nav-categories a {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-categories a:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
        }
